name: Release Minecraft Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/minecraft/**'
      - '.github/workflows/minecraft.release-chart.yaml'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: src
          fetch-depth: 0

      - name: 🔔 Checkout
        uses: actions/checkout@v4
        with:
          path: dest
          ref: "gh-pages"
          fetch-depth: 0

      - name: ⚙️ Configure Git
        working-directory: dest
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: 🪝 Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.3

      - name: "📦 Packing Helm Charts"
        shell: bash
        run: |
          helm dep up src/charts/minecraft
          helm package src/charts/minecraft -u -d dest

      - name: 🎁 Release Chart
        shell: bash
        working-directory: dest
        run: |
          helm repo index . --url https://charts.aries0d0f.me/ --merge index.yaml 
          git add $(git ls-files -o --exclude-standard)
          git add index.yaml
          git commit -m "Release from ref: $GITHUB_SHA"
          git push